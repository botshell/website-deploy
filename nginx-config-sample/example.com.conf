##
# Location: /etc/nginx/sites-available/example.com.conf
# This configuration file is for the domain-specific server block.
# To enable this configuration, create a symbolic link in the sites-enabled directory using the following command:
# sudo ln -s /etc/nginx/sites-available/example.com.conf /etc/nginx/sites-enabled/
# To view the currently enabled symbolic links, run:
#   ls -l /etc/nginx/sites-enabled/
# To disable this configuration, remove the symbolic link with:
#   sudo rm /etc/nginx/sites-enabled/example.com.conf
#
# After enabling or disabling, reload Nginx to apply changes:
#   sudo nginx -t && sudo systemctl reload nginx
##

# Virtual Host configuration for example.com
#
server {
	listen 80;
	listen [::]:80;
	server_name example.com;
	return 301 https://$host:443$request_uri;
	# 如果 https 端口是 443 可以不写，否则要写明具体端口
}


server {
	# listen 443 ssl;
	# listen [::]:443 ssl;

	# listen [::]:443 ssl ipv6only=off reuseport;
	# listen [::]:443 quic ipv6only=off reuseport;

	listen [::]:443 ssl;
	listen [::]:443 quic;
	server_name example.com;
	root /var/www/example.com;
	index index.php index.html index.htm;
	http2 on;
	add_header Alt-Svc 'h3=":443"; ma=86400';
	ssl_certificate /etc/ssl/certs/example.com.crt;
	ssl_certificate_key /etc/ssl/private/example.com.key;
	
	client_max_body_size 2000M;
	client_header_timeout 5m;
	keepalive_timeout 5m;
	ssl_session_timeout 1d;
	ssl_session_cache shared:MozSSL:100m;
	ssl_session_tickets off;
	gzip off;
	
	ssl_protocols TLSv1.2 TLSv1.3; # 建议弃用 1.0 和 1.1，除非有极老设备需求，已经不安全
	ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5';
	ssl_prefer_server_ciphers off; # 未设置时候默认是 off, 如果这里是 on, 有时会和 cloudflare 握手失败，不知道原因，有可能是上面加密套件的单引号，可以去除
	# 也可能是证书为 RSA 格式，而没有把该证书对应的加密算法放最前面，但是 ai 说单引号是必要的，防止后续用命令查找替换配置文件时候感叹号导致异常处理
	
	location / {
		# try_files $uri $uri/ /index.php?$args =404;
		# REMOVED '=404' to allow WordPress to handle virtual paths.
		# This ensures that Permalinks and REST API endpoints (like /wp-json/)
		# are correctly routed to index.php instead of returning a 404 error.
		try_files $uri $uri/ /index.php?$args;
	}
	
	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		# Default PHP processor. Update path if using a version-specific socket (e.g., phpX.Y-fpm).
		fastcgi_pass unix:/run/php/php-fpm.sock;  
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	}
	
	include snippets/cloudflare_real_ip.conf;
	access_log /var/log/nginx/example.com.access.log;
	error_log  /var/log/nginx/example.com.error.log;

	error_page 404 /404.html;
	error_page 500 502 503 504 /50x.html;
	location = /404.html {
		root /var/www/shared_errors;
		internal;
	}
	location = /50x.html {
		root /var/www/shared_errors;
		internal;
	}
}
